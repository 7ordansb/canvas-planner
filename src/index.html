<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="js/theme.js"></script>
  <title>Canvas Planner</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Feature styles (each feature module owns its own file) -->
  <link rel="stylesheet" href="css/sync.css" />
  <link rel="stylesheet" href="css/importer.css" />
  <link rel="stylesheet" href="css/extras.css" />
  <link rel="stylesheet" href="pinboard.css" />
  <link rel="stylesheet" href="css/canvas-elements.css" />
  <link rel="stylesheet" href="css/editor.css" />
</head>
<body>
  <main id="dashboard" aria-label="Dashboard" tabindex="-1" hidden></main>
  <div id="canvas"><div id="world"></div></div>
  <div id="hint">Double-click anywhere to add a note</div>

  <header id="toolbar" aria-label="Canvas Planner controls">
    <div class="toolbar-top">
      <span class="toolbar-brand">Canvas Planner</span>
      <nav id="crumbs" aria-label="Canvas path"></nav>
      <div id="toolbar-slot" role="group" aria-label="App controls"></div>
    </div>
    <div class="toolbar-commands">
      <div id="canvas-actions" class="toolbar-group" role="group" aria-label="Add to canvas">
        <div class="add-split">
          <button id="btn-new" title="New note (N)">+ New note</button>
          <button id="btn-add-menu" aria-label="Add element" aria-haspopup="menu" aria-expanded="false"><span class="chevron" aria-hidden="true"></span></button>
        </div>
      </div>
      <div class="toolbar-group toolbar-view" role="group" aria-label="Canvas view">
        <label class="toggle"><input type="checkbox" id="chk-hide-done" /> Hide done</label>
        <div id="filter-bar" hidden></div>
      </div>
    </div>
  </header>

  <nav id="zoom-controls" aria-label="Canvas zoom">
    <button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span>
    <button id="zoom-in" aria-label="Zoom in">+</button><button id="btn-fit">Fit</button>
  </nav>

  <aside id="panel" aria-labelledby="editor-heading" hidden>
    <header class="editor-header">
      <h2 id="editor-heading">Note</h2>
      <span id="editor-status" class="editor-status task-only"></span>
      <button id="btn-close-editor" aria-label="Close editor" title="Close editor" type="button">×</button>
    </header>
    <div class="editor-scroll">
      <label class="field editor-title">
        <span>Title</span>
        <textarea id="f-title" rows="2" placeholder="What needs doing?"></textarea>
      </label>
      <label class="editor-mode note-only">
        <span><strong>Task mode</strong><small>Add a due date and checklist</small></span>
        <input id="f-task-mode" type="checkbox" aria-label="Task mode" />
      </label>
      <section class="editor-section timer-only" aria-labelledby="editor-timer">
        <h3 id="editor-timer">Timer settings</h3>
        <label class="field"><span>Timer mode</span><select id="f-timer-mode"></select></label>
        <label class="field" id="f-timer-limit-field">
          <span id="f-timer-limit-label">Duration in seconds</span>
          <input id="f-timer-limit" type="number" min="1" step="1" />
        </label>
      </section>
      <section class="editor-section task-only" aria-labelledby="editor-schedule">
        <h3 id="editor-schedule">Schedule</h3>
        <div class="field">
          <label for="f-due">Due date</label>
          <input type="date" id="f-due" />
        </div>
        <div class="row editor-date-actions">
          <button type="button" data-due-offset="0" class="ghost small">Today</button>
          <button type="button" data-due-offset="1" class="ghost small">Tomorrow</button>
          <button id="btn-clear-due" class="ghost small" type="button">Clear</button>
        </div>
      </section>
      <section class="editor-section task-only" aria-label="Task checklist">
        <div class="editor-section-heading">
          <h3>Checklist</h3><strong id="f-checklist-progress"></strong>
        </div>
        <progress id="editor-checklist-meter" aria-label="Checklist completion" hidden></progress>
        <ol id="f-checklist"></ol>
        <form id="f-checklist-form" class="row">
          <input id="f-checklist-item" type="text" placeholder="Add a subtask" aria-label="New subtask" required />
          <button type="submit" class="primary">Add</button>
        </form>
      </section>
      <section class="editor-section note-only" aria-labelledby="editor-notes">
        <div class="editor-section-heading">
          <h3 id="editor-notes"><label for="f-notes">Notes</label></h3>
          <button id="btn-expand-notes" class="ghost small" type="button">Expand</button>
        </div>
        <textarea id="f-notes" rows="6" placeholder="Write your notes…"></textarea>
      </section>
      <section class="editor-section note-only" aria-label="Note attachments">
        <h3>Links and files</h3>
        <form id="f-link-form" class="row">
          <input id="f-link-url" type="text" inputmode="url" placeholder="Paste a web link" aria-label="Web link" required />
          <button type="submit" class="ghost">Add link</button>
        </form>
        <button id="btn-attach-file" class="ghost small" type="button">Attach a file…</button>
        <ul id="f-attachments"></ul>
      </section>
      <section class="editor-section editor-appearance" aria-labelledby="editor-appearance">
        <h3 id="editor-appearance">Appearance</h3>
        <label class="field note-only">
          <span>Note style</span>
          <select id="f-note-style"></select>
        </label>
        <div class="field" id="f-color-field">
          <span>Colour</span>
          <div id="f-colors" class="swatches"></div>
        </div>
      </section>
    </div>
    <footer class="editor-footer">
      <p id="f-info"></p>
      <div class="row editor-actions">
        <button id="btn-complete" class="primary task-only">Mark complete</button>
        <button id="btn-open" class="primary not-task">Open</button>
        <button id="btn-delete" class="danger">Delete</button>
      </div>
    </footer>
  </aside>

  <div id="toast" hidden><span id="toast-msg"></span><button id="toast-action" class="ghost small"></button></div>
  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
