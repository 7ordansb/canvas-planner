<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="js/theme.js"></script>
  <title>Canvas Planner</title>
  <link rel="stylesheet" href="style.css" />
  <!-- Feature styles (each feature module owns its own file) -->
  <link rel="stylesheet" href="css/sync.css" />
  <link rel="stylesheet" href="css/importer.css" />
  <link rel="stylesheet" href="css/extras.css" />
  <link rel="stylesheet" href="pinboard.css" />
  <link rel="stylesheet" href="css/canvas-elements.css" />
</head>
<body>
  <main id="dashboard" aria-label="Dashboard" tabindex="-1" hidden></main>
  <div id="canvas"><div id="world"></div></div>
  <div id="hint">Double-click anywhere to add a note</div>

  <header id="toolbar" aria-label="Canvas Planner controls">
    <div class="toolbar-top">
      <span class="toolbar-brand">Canvas Planner</span>
      <nav id="crumbs" aria-label="Canvas path"></nav>
      <div id="toolbar-slot" role="group" aria-label="App controls"></div>
    </div>
    <div class="toolbar-commands">
      <div id="canvas-actions" class="toolbar-group" role="group" aria-label="Add to canvas">
        <div class="add-split">
          <button id="btn-new" title="New note (N)">+ New note</button>
          <button id="btn-add-menu" aria-label="Add element" aria-haspopup="menu" aria-expanded="false"><span class="chevron" aria-hidden="true"></span></button>
        </div>
      </div>
      <div class="toolbar-group toolbar-view" role="group" aria-label="Canvas view">
        <label class="toggle"><input type="checkbox" id="chk-hide-done" /> Hide done</label>
        <div id="filter-bar" hidden></div>
      </div>
    </div>
  </header>

  <nav id="zoom-controls" aria-label="Canvas zoom">
    <button id="zoom-out" aria-label="Zoom out">−</button><span id="zoom-label">100%</span>
    <button id="zoom-in" aria-label="Zoom in">+</button><button id="btn-fit">Fit</button>
  </nav>

  <aside id="panel" hidden>
    <textarea id="f-title" rows="2" placeholder="What needs doing?"></textarea>
    <label class="field note-only">
      <span>Note style</span>
      <select id="f-note-style"></select>
    </label>
    <section class="field timer-only" aria-label="Timer settings">
      <label class="field"><span>Timer mode</span><select id="f-timer-mode"></select></label>
      <label class="field" id="f-timer-limit-field">
        <span id="f-timer-limit-label">Duration in seconds</span>
        <input id="f-timer-limit" type="number" min="1" step="1" />
      </label>
    </section>
    <div class="field" id="f-color-field">
      <span>Colour</span>
      <div id="f-colors" class="swatches"></div>
    </div>
    <label class="field note-only"><span><input id="f-task-mode" type="checkbox" /> Task mode</span></label>
    <div class="field task-only">
      <span>Due date</span>
      <div class="row">
        <input type="date" id="f-due" />
        <button id="btn-clear-due" class="ghost small">Clear</button>
      </div>
    </div>
    <label class="field note-only">
      <span>Notes</span>
      <textarea id="f-notes" rows="7" placeholder="Details, links, sub-steps…"></textarea>
    </label>
    <section class="field task-only" aria-label="Task checklist">
      <span>Checklist <strong id="f-checklist-progress"></strong></span>
      <ol id="f-checklist"></ol>
      <form id="f-checklist-form" class="row">
        <input id="f-checklist-item" type="text" placeholder="Add a subtask" aria-label="New subtask" required />
        <button type="submit" class="small">Add</button>
      </form>
    </section>
    <section class="field note-only" aria-label="Note attachments">
      <span>Links and files</span>
      <form id="f-link-form" class="row">
        <input id="f-link-url" type="text" inputmode="url" placeholder="Paste a web link" aria-label="Web link" required />
        <button type="submit" class="small">Add link</button>
      </form>
      <button id="btn-attach-file" class="small" type="button">Attach a file…</button>
      <ul id="f-attachments"></ul>
    </section>
    <p id="f-info"></p>
    <div class="row">
      <button id="btn-complete" class="task-only">Mark complete</button>
      <button id="btn-open" class="not-task">Open</button>
      <button id="btn-delete" class="danger">Delete</button>
    </div>
  </aside>

  <div id="toast" hidden><span id="toast-msg"></span><button id="toast-action" class="ghost small"></button></div>
  <div id="modal-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
