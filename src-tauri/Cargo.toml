[package]
name = "canvas-planner"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-opener = "2"
serde_json = "1"
base64 = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
