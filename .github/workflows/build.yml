name: Build portable apps

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # macOS: one .app that runs on both Apple Silicon and Intel Macs, zipped.
      - name: Build Mac app
        if: matrix.name == 'mac'
        run: |
          npx tauri build --target universal-apple-darwin --bundles app
          mkdir -p dist
          ditto -c -k --keepParent "src-tauri/target/universal-apple-darwin/release/bundle/macos/Canvas Planner.app" dist/CanvasPlanner-mac.zip

      # Windows: a single portable .exe, no installer.
      - name: Build Windows exe
        if: matrix.name == 'windows'
        shell: bash
        run: |
          npx tauri build --no-bundle
          mkdir -p dist
          cp src-tauri/target/release/canvas-planner.exe dist/CanvasPlanner.exe

      - name: Verify Windows app opens
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          $planner = Start-Process dist/CanvasPlanner.exe -PassThru
          try {
            for ($i = 0; $i -lt 60; $i++) {
              $planner.Refresh()
              if ($planner.HasExited) { throw "Canvas Planner exited during startup" }
              if ($planner.MainWindowHandle -ne 0) { break }
              Start-Sleep -Seconds 1
            }
            if ($planner.MainWindowHandle -eq 0) { throw "Canvas Planner window did not open" }
          } finally {
            if (!$planner.HasExited) { $planner.Kill() }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: CanvasPlanner-${{ matrix.name }}
          path: dist/*

      # On a version tag (e.g. v0.1.0), also attach the files to a GitHub Release.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
